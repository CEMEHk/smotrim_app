<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Смотрим ❤️💜</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f3fa;--sf:#fff;--tx:#17121f;--mu:#7d7790;--ln:rgba(23,18,31,.08);--chip:rgba(23,18,31,.06);--glass:rgba(245,243,250,.8);--sh:0 10px 28px rgba(23,18,31,.14);--bd:rgba(10,6,16,.5);--bad:#e0264f;--g:linear-gradient(135deg,#ff4d8d,#7a5cff);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0b16;--sf:#1b1526;--tx:#f4f0fa;--mu:#9d95b0;--ln:rgba(255,255,255,.08);--chip:rgba(255,255,255,.08);--glass:rgba(15,11,22,.8);--sh:0 10px 28px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0b16;--sf:#1b1526;--tx:#f4f0fa;--mu:#9d95b0;--ln:rgba(255,255,255,.08);--chip:rgba(255,255,255,.08);--glass:rgba(15,11,22,.8);--sh:0 10px 28px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;max-width:480px;min-height:100vh;padding-bottom:110px;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:10}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #7a5cff;outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:14px 16px 10px}
.top{display:flex;align-items:center;gap:8px}
h1{flex:1;margin:0;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.03em}
h2{margin:0 0 12px;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.ico{width:34px;height:34px;border-radius:50%;background:var(--chip);font-size:18px}
.sr{display:flex;gap:8px;margin-top:12px}
.q{flex:1;min-width:0;width:100%;padding:12px 16px;border-radius:16px;border:0;background:var(--chip);color:var(--tx);font:inherit}
.views{display:flex;background:var(--chip);border-radius:16px;padding:3px}
.views button{width:36px;border-radius:13px;display:grid;place-items:center;color:var(--mu)}
.views button.on{background:var(--sf);color:var(--tx);box-shadow:0 2px 8px var(--ln)}
.seg{display:flex;margin-top:12px;background:var(--chip);border-radius:16px;padding:4px}
.seg button{flex:1;padding:9px 4px;border-radius:12px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 2px 8px var(--ln)}
.seg small{margin-left:4px;font-weight:500;opacity:.7}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px}
.chips .cp{flex:none}
.cp{display:inline-flex;align-items:center;padding:6px 14px;border-radius:18px;background:var(--chip);color:var(--mu);font-weight:500}
.cp.on{background:var(--g);color:#fff}
.nb{margin-left:6px;background:var(--g);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
.grid{display:grid;padding:14px 16px}
.g2{grid-template-columns:repeat(2,1fr);gap:20px 14px}
.g3{grid-template-columns:repeat(3,1fr);gap:16px 10px}
.gl{grid-template-columns:1fr}
.tile{display:block;width:100%;text-align:left}
.pz{position:relative;aspect-ratio:2/3;border-radius:20px;overflow:hidden;box-shadow:var(--sh);display:grid;place-items:center;font-size:52px}
.pz>span{position:relative}
.pz>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pz::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.4),transparent 45%)}
.bdg{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#fff}
.who1{left:10px;top:10px;width:28px;height:28px;justify-content:center;border-radius:50%;background:rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:14px}
.cnt{right:10px;top:10px;padding:4px 9px;border-radius:12px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.prg{left:10px;bottom:10px;padding:5px 11px;border-radius:12px;background:var(--g);box-shadow:0 4px 12px rgba(122,92,255,.5)}
.fv{right:10px;bottom:10px;font-size:15px}
.g3 .pz{font-size:34px;border-radius:14px}.g3 .bdg{font-size:10px}
.g3 .who1{left:6px;top:6px;width:22px;height:22px;font-size:11px}.g3 .cnt{right:6px;top:6px;padding:3px 7px}
.g3 .prg{left:6px;bottom:6px;padding:3px 8px}.g3 .fv{right:6px;bottom:6px;font-size:12px}
.tt{margin-top:9px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g3 .tt{font-size:13px}.g3 .mt{font-size:12px}
.mt{margin-top:2px;color:var(--mu);font-size:13px}
.row{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.row .pz{width:62px;flex:none;font-size:26px;border-radius:12px}
.row .in{flex:1;min-width:0}.row .tt{margin-top:0;-webkit-line-clamp:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:10px;background:var(--chip);font-size:12px;font-weight:600}
.tag.p{background:var(--g);color:#fff}
.empty{grid-column:1/-1;padding:56px 24px;text-align:center;color:var(--mu)}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:22px;background:var(--g);color:#fff;font-size:32px;box-shadow:0 10px 24px rgba(122,92,255,.55);z-index:20}
.bk{position:fixed;inset:0;background:var(--bd);z-index:30;display:none}
.bk.on{display:block}
.sh{position:fixed;left:50%;bottom:0;width:min(100%,480px);max-height:90%;overflow:auto;transform:translate(-50%,100%);transition:transform .25s ease;background:var(--sf);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));z-index:31}
.sh.on{transform:translate(-50%,0)}
.grip{width:40px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 16px}
.hd{display:flex;gap:16px}
.hd .pz{width:100px;flex:none;font-size:38px;border-radius:16px}
.hd h2{margin:0}
.sub{color:var(--mu);font-size:13px;margin-top:4px}
.lb{margin:16px 0 8px}
.fl{display:flex;flex-wrap:wrap;gap:8px}
.rt{display:inline-flex;align-items:center;gap:5px;margin:8px 6px 0 0;padding:3px 10px;border-radius:10px;background:var(--chip);font-weight:700;font-size:13px}
.sh p{margin:14px 0;color:var(--mu)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}.kv span:nth-child(odd){color:var(--mu)}
.kv span{display:inline-flex;align-items:center;gap:5px}
.st{display:flex;align-items:center;gap:8px;margin-top:16px;padding:10px 12px;border-radius:16px;background:var(--chip)}
.st b{flex:1;font-size:17px}
.st em{font-style:normal;color:var(--mu);font-size:12px}
.st button{width:34px;height:34px;border-radius:50%;background:var(--sf);font-size:18px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{flex:1 1 140px;padding:14px;border-radius:16px;background:var(--chip);font-weight:700;text-align:center}
.btn.main{background:var(--g);color:#fff;box-shadow:0 8px 20px rgba(122,92,255,.4)}
.hit{display:flex;gap:12px;align-items:center;width:100%;padding:10px 0;border-bottom:1px solid var(--ln);text-align:left}
.mini{position:relative;flex:none;width:44px;height:64px;border-radius:10px;overflow:hidden;display:grid;place-items:center;font-size:20px}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hit b{display:block}.dup{color:var(--bad);font-size:12px}
.sh .empty{padding:28px 0}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:88%;padding:12px 18px;border-radius:16px;background:var(--tx);color:var(--bg);font-weight:500;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Смотрим ❤️💜</h1><button class="ico" id="ref" aria-label="Обновить">↻</button></div>
  <div class="sr"><input class="q" id="q" type="search" placeholder="Поиск по названию"><div class="views" id="views"></div></div>
  <div class="seg" id="tabs"></div>
</header>
<div class="chips" id="chips"></div>
<main class="grid g2" id="list"></main>
<button class="fab" id="add" aria-label="Добавить">+</button>
<div class="bk" id="bk"></div>
<div class="sh" id="sh"></div>
<div id="toast"></div>
<script>
var API='https://script.google.com/macros/s/AKfycbwOibNpstA0MZkHToCGmW91yegnE65amjoVrBtZygny38Tv5JAtZRoK75ShLOo8yIom/exec';
var tg=window.Telegram&&Telegram.WebApp,D=[],cur=null;
var S={tab:'now',fmt:'Все',q:'',me:0,add:0,v:'2',fav:false,started:false,by:null,genre:null,top:false,multi:false,sort:'def'};
var $=function(i){return document.getElementById(i)};
var TABS=[['now','Смотрим'],['want','Список'],['done','Просмотрено']],FM=['Все','Фильм','Сериал','Мультфильм'];
var EM={'Фильм':'🎬','Сериал':'📺','Мультфильм':'🧸'};
var ERR={auth:'Не удалось проверить Telegram. Закройте и снова откройте приложение через бота.',forbidden:'Это приложение только для двоих.',no_tmdb_key:'В таблице не задан ключ TMDB.',server:'Ошибка на стороне таблицы. Попробуйте ещё раз.'};
if(tg){try{tg.ready();tg.expand();document.documentElement.dataset.theme=tg.colorScheme;tg.setHeaderColor(tg.colorScheme=='dark'?'#0f0b16':'#f5f3fa');tg.setBackgroundColor(tg.colorScheme=='dark'?'#0f0b16':'#f5f3fa')}catch(e){}}
function hap(){try{tg.HapticFeedback.impactOccurred('light')}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function svg(s,w){return '<svg width="'+w+'" height="'+w+'" viewBox="0 0 20 20" fill="currentColor">'+s+'</svg>'}
var IC2=svg('<rect x="2" y="2" width="7" height="7" rx="2"/><rect x="11" y="2" width="7" height="7" rx="2"/><rect x="2" y="11" width="7" height="7" rx="2"/><rect x="11" y="11" width="7" height="7" rx="2"/>',18);
var IC3=(function(){var s='';[1,7.5,14].forEach(function(y){[1,7.5,14].forEach(function(x){s+='<rect x="'+x+'" y="'+y+'" width="5" height="5" rx="1.5"/>'})});return svg(s,18)})();
var ICL=svg('<rect x="2" y="3" width="4" height="4" rx="1.2"/><rect x="8" y="4" width="10" height="2" rx="1"/><rect x="2" y="8" width="4" height="4" rx="1.2"/><rect x="8" y="9" width="10" height="2" rx="1"/><rect x="2" y="13" width="4" height="4" rx="1.2"/><rect x="8" y="14" width="10" height="2" rx="1"/>',18);
var ICF=svg('<path d="M2 4h16l-6 7v5l-4-2v-3z"/>',14);
function eye(n){return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'+n}
function nm(s){return String(s||'').toLowerCase().replace(/ё/g,'е')}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function bg(s){s=String(s||'');var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;
 return 'radial-gradient(circle at 25% 15%,hsl('+h+' 85% 68%),transparent 60%),linear-gradient(160deg,hsl('+(h+25)+' 70% 52%),hsl('+(h+75)+' 62% 26%))'}
function ts(d){if(!d)return 0;var p=String(d).split('.');return p.length==3?new Date(p[2],p[1]-1,p[0]).getTime():new Date(p[0],0,1).getTime()}
function toast(t){var e=$('toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},3200)}
function store(){try{localStorage.setItem('sm',JSON.stringify(D))}catch(e){}}
function api(b){b.initData=tg.initData;return fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error);return j})}
function fail(e){var m=ERR[e.message]||'Нет связи. Проверьте интернет и попробуйте ещё раз.';if(D.length)toast(m);else $('list').innerHTML='<div class="empty">'+m+'</div>'}
function load(){return api({action:'list'}).then(function(j){D=j.items;S.me=S.add=j.me.who;store();render()}).catch(fail)}
function byId(id){return D.filter(function(x){return x.id==id})[0]}
function upd(it,id){var i=D.findIndex(function(x){return x.id==id});if(i<0)return;if(it)D[i]=it;else D.splice(i,1);store();render()}
function setOp(id,op,value){return api({action:'set',id:id,op:op,value:value}).then(function(j){upd(j.item,id)})}
function ok(x){var q=nm(S.q.trim());
 return x.st==S.tab&&(S.fmt=='Все'||x.f==S.fmt)&&(!q||nm(x.ru).indexOf(q)>=0||nm(x.en).indexOf(q)>=0)&&(!S.fav||x.fav)&&(!S.started||(x.ser&&x.st!='done'))&&(S.by===null||x.by===S.by)&&(!S.genre||nm(x.g).indexOf(S.genre)>=0)&&(!S.top||x.r>=8)&&(!S.multi||x.n>1)}
function nflt(){return (S.by!==null)+(S.genre!==null)+S.top+S.multi+(S.sort!='def')}
function chip(k,v,l,on){return '<button class="cp'+(on?' on':'')+'" data-k="'+k+'"'+(v===undefined?'':' data-v="'+esc(v)+'"')+'>'+l+'</button>'}
function pz(x){return '<div class="pz" style="background:'+bg(x.en||x.ru)+'"><span>'+(EM[x.f]||'🎬')+'</span>'+(x.poster?'<img src="'+esc(x.poster)+'" loading="lazy" alt="" onerror="this.remove()">':'')}
function meta(x){return esc([x.y,String(x.f).toLowerCase()].filter(Boolean).join(', ')+(x.st=='done'&&x.d?', '+x.d:''))}
function render(){
 $('tabs').innerHTML=TABS.map(function(t){var n=D.filter(function(x){return x.st==t[0]}).length;return '<button data-t="'+t[0]+'" class="'+(S.tab==t[0]?'on':'')+'">'+t[1]+'<small>'+n+'</small></button>'}).join('');
 var n=nflt();
 $('chips').innerHTML='<button class="cp'+(n?' on':'')+'" data-a2="flt">'+ICF+'&nbsp;Фильтры'+(n?'<b class="nb">'+n+'</b>':'')+'</button>'+FM.map(function(f){return chip('fmt',f,f=='Все'?'Все':f+'ы',S.fmt==f)}).join('')+chip('fav',undefined,'⭐ Избранное',S.fav)+chip('started',undefined,'Начатые',S.started);
 $('views').innerHTML=[['2',IC2,'Плитки в 2 столбца'],['3',IC3,'Плитки в 3 столбца'],['l',ICL,'Список']].map(function(v){return '<button data-view="'+v[0]+'" class="'+(S.v==v[0]?'on':'')+'" aria-label="'+v[2]+'">'+v[1]+'</button>'}).join('');
 var L=D.filter(ok),s=S.sort;
 if(s=='az')L.sort(function(a,b){return a.ru.localeCompare(b.ru,'ru')});
 else if(s=='year')L.sort(function(a,b){return (+b.y||0)-(+a.y||0)});
 else if(s=='rating')L.sort(function(a,b){return b.r-a.r});
 else if(S.tab=='done')L.sort(function(a,b){return ts(b.d)-ts(a.d)});
 var li=S.v=='l',w=$('list');w.className='grid '+(li?'gl':'g'+S.v);
 if(!L.length){w.innerHTML='<div class="empty">'+(D.length?'Ничего не нашлось.<br>Нажмите «+», чтобы добавить, или поменяйте фильтры.':'Загружаю список…')+'</div>';return}
 w.innerHTML=L.map(function(x){
  var em=x.by===null?'':(x.by?'💜':'❤️'),prg=x.ser&&x.st!='done'?'Серия '+esc(x.ser):'';
  if(li)return '<button class="tile row" data-id="'+esc(x.id)+'">'+pz(x)+'</div><div class="in"><div class="tt">'+esc(x.ru)+(x.fav?' ⭐':'')+'</div><div class="mt">'+esc(x.en)+'</div><div class="mt">'+meta(x)+'</div><div class="tags">'+(em?'<span class="tag">'+em+'</span>':'')+(x.n>0?'<span class="tag">'+eye(x.n)+'</span>':'')+(prg?'<span class="tag p">'+prg+'</span>':'')+'</div></div></button>';
  return '<button class="tile" data-id="'+esc(x.id)+'">'+pz(x)+(em?'<div class="bdg who1">'+em+'</div>':'')+(x.n>0?'<div class="bdg cnt">'+eye(x.n)+'</div>':'')+(prg?'<div class="bdg prg">'+prg+'</div>':'')+(x.fav?'<div class="bdg fv">⭐</div>':'')+'</div><div class="tt">'+esc(x.ru)+'</div><div class="mt">'+meta(x)+'</div></button>'}).join('');
}
function openSheet(h){$('sh').innerHTML='<div class="grip"></div>'+h;$('bk').className='bk on';$('sh').className='sh on'}
function closeSheet(){$('bk').className='bk';$('sh').className='sh'}
function filterSheet(){
 var G={};D.forEach(function(x){String(x.g).split(/,\s*/).forEach(function(g){g=g.trim().toLowerCase();if(g)G[g]=1})});
 var SO=[['def','Как в таблице'],['az','А—Я'],['year','Новые'],['rating','Рейтинг']];
 openSheet('<h2>Фильтры</h2><div class="sub lb">Кто предложил</div><div class="fl">'+chip('by',0,'❤️',S.by===0)+chip('by',1,'💜',S.by===1)+'</div>'+
  '<div class="sub lb">Жанр</div><div class="fl">'+Object.keys(G).sort().map(function(g){return chip('genre',g,esc(cap(g)),S.genre===g)}).join('')+'</div>'+
  '<div class="sub lb">Ещё</div><div class="fl">'+chip('top',undefined,'Рейтинг 8+',S.top)+chip('multi',undefined,'Смотрели не раз',S.multi)+'</div>'+
  '<div class="sub lb">Сортировка</div><div class="fl">'+SO.map(function(s){return chip('sort',s[0],s[1],S.sort==s[0])}).join('')+'</div>'+
  '<div class="acts"><button class="btn" data-a2="reset">Сбросить</button><button class="btn main" data-a2="close">Показать</button></div>');
}
function detail(id){
 var x=byId(id);if(!x)return;cur=id;var a='';
 if(x.f=='Сериал')a='<div class="st"><b>Серия '+(esc(x.ser)||'не начата')+'</b><em>сезон</em><button data-a="s-">−</button><button data-a="s+">+</button><em>серия</em><button data-a="e-">−</button><button data-a="e+">+</button></div>';
 var B={want:'<button class="btn main" data-a="now">Смотрим сейчас</button><button class="btn" data-a="done">Просмотрено</button>',
  now:'<button class="btn main" data-a="done">Просмотрено</button><button class="btn" data-a="want">'+(x.n>0?'Отменить пересмотр':'Вернуть в список')+'</button>',
  done:'<button class="btn main" data-a="now">Смотрим снова</button><button class="btn" data-a="n+">Ещё один просмотр (+1)</button>'}[x.st];
 var rt=x.f=='Сериал'?(x.seasons?x.seasons+' сез.':''):(x.runtime?x.runtime+' мин':'');
 openSheet('<div class="hd">'+pz(x)+'</div><div><h2>'+esc(x.ru)+'</h2><div class="sub">'+esc(x.en)+'</div><div class="sub">'+meta(x)+'</div>'+(x.r?'<span class="rt">★ '+x.r+'</span>':'')+(x.n>0?'<span class="rt">'+eye(x.n)+'</span>':'')+'</div></div>'+(x.o?'<p>'+esc(x.o)+'</p>':'')+
 '<div class="kv">'+(x.g?'<span>Жанр</span><span>'+esc(cap(x.g))+'</span>':'')+(x.country?'<span>Страна</span><span>'+esc(x.country)+'</span>':'')+(rt?'<span>Длительность</span><span>'+rt+'</span>':'')+(x.by!==null?'<span>Предложил(а)</span><span>'+(x.by?'💜':'❤️')+'</span>':'')+(x.n?'<span>Смотрели</span><span>'+eye(x.n)+(x.d?', последний: '+esc(x.d):'')+'</span>':'')+'</div>'+a+
 '<div class="acts">'+B+'<button class="btn" data-a="fav">'+(x.fav?'⭐ Убрать из избранного':'☆ В избранное')+'</button></div>');
}
var MSG={now:'Перенесено в «Смотрим»',want:'Готово',done:'Записали просмотр','n+':'Ещё один просмотр записан',fav:'Готово'};
function act(a){
 var x=byId(cur);if(!x)return;
 if(a=='s+'||a=='s-'||a=='e+'||a=='e-'){
  var m=(x.ser||'1,00').split(','),s=+m[0],e=+m[1];
  if(a=='s+'){s++;e=1}if(a=='s-'&&s>1){s--;e=1}if(a=='e+')e++;if(a=='e-'&&e>1)e--;
  x.ser=s+','+('0'+e).slice(-2);detail(x.id);render();
  clearTimeout(act.t);act.t=setTimeout(function(){setOp(x.id,'ser',x.ser).catch(fail)},900);return}
 hap();toast('Сохраняю…');
 setOp(x.id,a).then(function(){var y=byId(x.id);toast(MSG[a]);
  if(a=='fav'||a=='n+'){if(y)detail(y.id)}else{closeSheet();if(y)S.tab=y.st;render()}}).catch(fail);
}
function hitsHtml(R){return R.length?R.map(function(c){return '<button class="hit" data-key="'+esc(c.key)+'" data-dup="'+(c.dup?1:0)+'"><div class="mini" style="background:'+bg(c.ru)+'">'+(EM[c.f]||'🎬')+(c.poster?'<img src="'+esc(c.poster)+'" alt="" onerror="this.remove()">':'')+'</div><div><b>'+esc(c.ru)+'</b><span class="sub">'+esc([c.y,String(c.f).toLowerCase()].filter(Boolean).join(', '))+'</span>'+(c.dup?'<div class="dup">Уже в таблице</div>':'')+'</div></button>'}).join(''):'<div class="empty">Не нашли. Попробуйте добавить год: «Название (2014)».</div>'}
function addSheet(){
 S.add=S.me;
 openSheet('<h2>Добавить</h2><div class="sub" style="margin:0 0 8px">Кто предложил</div><div class="fl" style="margin-bottom:12px">'+chip('add',0,'❤️',S.add==0)+chip('add',1,'💜',S.add==1)+'</div><input class="q" id="aq" placeholder="Название на русском или английском"><div id="hits"><div class="empty">Начните вводить название.<br>Остальное подтянется само.</div></div>');
 $('aq').focus();
 $('aq').oninput=function(){
  clearTimeout(addSheet.t);var v=this.value.trim();
  if(v.length<2){$('hits').innerHTML='';return}
  $('hits').innerHTML='<div class="empty">Ищу…</div>';
  addSheet.t=setTimeout(function(){api({action:'search',q:v}).then(function(j){if($('aq')&&$('aq').value.trim()==v)$('hits').innerHTML=hitsHtml(j.results)}).catch(function(e){$('hits').innerHTML='<div class="empty">'+(ERR[e.message]||'Нет связи.')+'</div>'})},500)};
}
function addItem(key){
 toast('Добавляю…');
 api({action:'add',key:key,who:S.add}).then(function(j){var it=j.item;if(!it)return;
  var i=D.findIndex(function(x){return x.id==it.id});if(i<0)D.push(it);else D[i]=it;store();
  closeSheet();S.tab=it.st;S.q='';$('q').value='';render();toast(j.dup?'Это уже было в таблице':'Добавили «'+it.ru+'»')}).catch(fail);
}
document.addEventListener('click',function(e){
 var t=e.target.closest('button,#bk');if(!t)return;var d=t.dataset;
 if(t.id=='bk')closeSheet();
 else if(t.id=='ref'){toast('Обновляю…');load()}
 else if(d.t){S.tab=d.t;render()}
 else if(d.view){S.v=d.view;render()}
 else if(d.k){
  if(d.k=='add'){S.add=+d.v;[].forEach.call(t.parentNode.children,function(b){b.classList.toggle('on',b===t)});return}
  if(d.v===undefined)S[d.k]=!S[d.k];
  else if(d.k=='fmt'||d.k=='sort')S[d.k]=d.v;
  else S[d.k]=String(S[d.k])===d.v?null:(d.k=='by'?+d.v:d.v);
  render();if(t.closest('#sh'))filterSheet()}
 else if(d.a2=='flt')filterSheet();
 else if(d.a2=='reset'){S.by=null;S.genre=null;S.top=false;S.multi=false;S.sort='def';S.fav=false;S.started=false;S.fmt='Все';render();filterSheet()}
 else if(d.a2=='close')closeSheet();
 else if(d.id&&t.classList.contains('tile'))detail(d.id);
 else if(d.a)act(d.a);
 else if(t.id=='add')addSheet();
 else if(d.key){if(d.dup=='1'){closeSheet();if(byId(d.key)){S.tab=byId(d.key).st;render();detail(d.key)}}else addItem(d.key)}
});
$('q').oninput=function(){S.q=this.value;render()};
try{D=JSON.parse(localStorage.getItem('sm')||'[]')}catch(e){D=[]}
render();
if(!tg||!tg.initData){$('list').innerHTML='<div class="empty">Откройте приложение через бота в Telegram.</div>'}
else load();
</script>
</body>
