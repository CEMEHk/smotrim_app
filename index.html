<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Смотрим</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f3fa;--sf:#fff;--tx:#17121f;--mu:#7d7790;--ln:rgba(23,18,31,.08);--chip:rgba(23,18,31,.06);--glass:rgba(245,243,250,.85);--sh:0 10px 28px rgba(23,18,31,.14);--bd:rgba(10,6,16,.5);--bad:#e0264f;--g:linear-gradient(135deg,#ff4d8d,#7a5cff);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0b16;--sf:#1b1526;--tx:#f4f0fa;--mu:#9d95b0;--ln:rgba(255,255,255,.08);--chip:rgba(255,255,255,.08);--glass:rgba(15,11,22,.85);--sh:0 10px 28px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0b16;--sf:#1b1526;--tx:#f4f0fa;--mu:#9d95b0;--ln:rgba(255,255,255,.08);--chip:rgba(255,255,255,.08);--glass:rgba(15,11,22,.85);--sh:0 10px 28px rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;max-width:480px;min-height:100vh;padding-bottom:110px;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--glass);z-index:10}
button,input,label,.tile{touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #7a5cff;outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--glass);padding:10px 16px}
h2{margin:0 0 12px;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.sr{display:flex;gap:8px;align-items:center}
.ico{flex:none;width:40px;height:40px;border-radius:50%;background:var(--chip);font-size:18px}
.q{flex:1;min-width:0;width:100%;padding:12px 16px;border-radius:16px;border:0;background:var(--chip);color:var(--tx);font:inherit}
.views{display:flex;background:var(--chip);border-radius:16px;padding:3px}
.views button{width:36px;height:34px;border-radius:13px;display:grid;place-items:center;color:var(--mu)}
.views button.on{background:var(--sf);color:var(--tx);box-shadow:0 2px 8px var(--ln)}
.seg{display:flex;margin-top:10px;background:var(--chip);border-radius:16px;padding:4px}
.seg button{flex:1;min-width:0;padding:9px 2px;border-radius:12px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--mu)}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 2px 8px var(--ln)}
.seg small{margin-left:3px;font-size:11px;font-weight:500;opacity:.7}
.chips{display:flex;gap:6px;padding:12px 16px 4px}
.chips .cp{flex:1 1 auto;min-width:0;padding:6px 4px;font-size:13px;white-space:nowrap}
.chips .cp.ic{flex:0 0 auto;min-width:38px;padding:6px 8px}
.cp{flex:none;display:inline-flex;align-items:center;justify-content:center;padding:6px 14px;border-radius:18px;background:var(--chip);color:var(--mu);font-weight:500}
.cp.ic{padding:6px 12px}
.cp.on{background:var(--g);color:#fff}
.nb{margin-left:4px;background:var(--tx);color:var(--bg);border-radius:10px;padding:0 6px;font-size:11px}
.w0{--wc:#ff3b4e}.w1{--wc:#8b5cf6}
.grid{display:grid;padding:14px 16px}
.g2{grid-template-columns:repeat(2,1fr);gap:20px 14px}
.g3{grid-template-columns:repeat(3,1fr);gap:16px 10px}
.gl{grid-template-columns:1fr}
.tile{display:block;width:100%;text-align:left}
.pz{position:relative;aspect-ratio:2/3;border-radius:20px;border:3px solid var(--wc,transparent);overflow:hidden;box-shadow:var(--sh);display:grid;place-items:center;font-size:52px}
.pz>span{position:relative}
.pz>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pz::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.4),transparent 45%)}
.bdg{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#fff}
.nw{left:8px;top:8px;width:26px;height:26px;justify-content:center;border-radius:50%;background:var(--g);font-size:11px}
.cnt{right:8px;top:8px;padding:4px 9px;border-radius:12px;background:rgba(0,0,0,.5)}
.prg{left:8px;bottom:8px;padding:5px 11px;border-radius:12px;background:var(--g);box-shadow:0 4px 12px rgba(122,92,255,.5)}
.fv{right:8px;bottom:8px;font-size:15px}
.g3 .pz{font-size:34px;border-radius:14px;border-width:2px}.g3 .bdg{font-size:10px}
.g3 .nw{left:5px;top:5px;width:20px;height:20px}.g3 .cnt{right:5px;top:5px;padding:3px 7px}
.g3 .prg{left:5px;bottom:5px;padding:3px 8px}.g3 .fv{right:5px;bottom:5px;font-size:12px}
.tt{margin-top:9px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g3 .tt{font-size:13px}.g3 .mt{font-size:12px}
.mt{margin-top:2px;color:var(--mu);font-size:13px}
.row{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.row .pz{width:62px;flex:none;font-size:26px;border-radius:12px;border-width:2px}
.row .in{flex:1;min-width:0}.row .tt{margin-top:0;-webkit-line-clamp:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:10px;background:var(--chip);font-size:12px;font-weight:600}
.tag.p{background:var(--g);color:#fff}
.cr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-left:4px solid var(--wc,transparent);border-bottom:1px solid var(--ln)}
.cr .in{flex:1;min-width:0}.cr .tt{margin:0;-webkit-line-clamp:1}
.cr .rg{flex:none;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--mu)}
.nw.dp{background:#8d8799}
.ga.c4{grid-template-columns:repeat(4,1fr)}.ga.c2{grid-template-columns:repeat(2,1fr)}
.empty{grid-column:1/-1;padding:56px 24px;text-align:center;color:var(--mu)}
.fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:22px;background:var(--g);color:#fff;font-size:32px;box-shadow:0 10px 24px rgba(122,92,255,.55);z-index:20}
.bk{position:fixed;inset:0;background:var(--bd);z-index:30;display:none}
.bk.on{display:block}
.sh{position:fixed;left:50%;bottom:0;width:min(100%,480px);max-height:92%;overflow:auto;transform:translate(-50%,100%);transition:transform .2s ease;background:var(--sf);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));z-index:31}
.sh.on{transform:translate(-50%,0)}
.grip{width:40px;height:4px;border-radius:2px;background:var(--ln);margin:0 auto 16px}
.hd{display:flex;gap:16px}
.hd .pz{width:100px;flex:none;font-size:38px;border-radius:16px}
.hd h2{margin:0}
.sub{color:var(--mu);font-size:13px;margin-top:4px}
.lb{margin:16px 0 8px}
.fl{display:flex;flex-wrap:wrap;gap:8px}
.rt{display:inline-flex;align-items:center;gap:5px;margin:8px 6px 0 0;padding:3px 10px;border-radius:10px;background:var(--chip);font-weight:700;font-size:13px}
.sh p{margin:14px 0 0;color:var(--mu)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin-top:12px}.kv span:nth-child(odd){color:var(--mu)}
.ga{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.ab{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--chip);font-size:12px;font-weight:600;text-align:center;line-height:1.15}
.ab span{font-size:22px;line-height:1}
.ab.on{background:var(--g);color:#fff}
.ab input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.st{display:flex;align-items:center;gap:8px;margin-top:12px;padding:8px 12px;border-radius:16px;background:var(--chip)}
.st b{flex:1;font-size:15px}
.st em{font-style:normal;color:var(--mu);font-size:12px}
.st button{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sf);font-size:18px;border:3px solid transparent}
.st button.on{border-color:var(--wc)}
.st .n{flex:none;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:700}
.ey{display:block;flex:none}
.hit{display:flex;gap:12px;align-items:center;width:100%;padding:10px 0;border-bottom:1px solid var(--ln);text-align:left}
.mini{position:relative;flex:none;width:44px;height:64px;border-radius:10px;overflow:hidden;display:grid;place-items:center;font-size:20px}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hit b{display:block}.dup{color:var(--bad);font-size:12px}
.btn{flex:1 1 140px;padding:14px;border-radius:16px;background:var(--chip);font-weight:700;text-align:center}
.btn.main{background:var(--g);color:#fff}
.acts{display:flex;gap:10px;margin-top:18px}
.sh .empty{padding:28px 0}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:88%;padding:12px 18px;border-radius:16px;background:var(--tx);color:var(--bg);font-weight:500;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="sr"><input class="q" id="q" type="search" placeholder="Поиск по названию"><button class="ico" id="ref" aria-label="Обновить">↻</button><div class="views" id="views"></div></div>
  <div class="seg" id="tabs"></div>
</header>
<div class="chips" id="chips"></div>
<main class="grid g2" id="list"></main>
<button class="fab" id="add" aria-label="Добавить">+</button>
<div class="bk" id="bk"></div>
<div class="sh" id="sh"></div>
<div id="toast"></div>
<script>
var API='https://script.google.com/macros/s/AKfycbwOibNpstA0MZkHToCGmW91yegnE65amjoVrBtZygny38Tv5JAtZRoK75ShLOo8yIom/exec';
var tg=window.Telegram&&Telegram.WebApp,D=[],cur=null,SHEET='',dirty=false,pend={};
var S={tab:'all',fmt:'Все',q:'',me:0,add:0,v:'2',fav:false,unw:false,by:null,genres:[],top:false,multi:false,sort:'def'};
var $=function(i){return document.getElementById(i)};
var TABS=[['all','Список'],['now','Смотрим'],['done','Просмотрено'],['drop','Заброшено']],FM=[['Все','Все'],['Фильм','Фильмы'],['Сериал','Сериалы'],['Мультфильм','Мультики']];
var EM={'Фильм':'🎬','Сериал':'📺','Мультфильм':'🧸'};
var ERR={auth:'Не удалось проверить Telegram. Закройте и снова откройте приложение через бота.',forbidden:'Это приложение только для двоих.',no_tmdb_key:'В таблице не задан ключ TMDB.',server:'Ошибка на стороне таблицы. Попробуйте ещё раз.',net:'Нет связи с таблицей. Проверьте интернет и попробуйте ещё раз.',bad_response:'Таблица ответила не так, как ожидалось. Проверьте, что развёртывание в Apps Script обновлено до новой версии.',bad_request:'Таблица не поняла команду. Скорее всего, в Apps Script не опубликована новая версия.',not_found:'Не нашёл эту строку в таблице. Нажмите ↻, возможно, список изменился.',old:'Таблица работает на старой версии скрипта. В Apps Script: Управление развёртываниями → карандаш → Новая версия → Развернуть.'};
if(tg){try{tg.ready();tg.expand();var dk=tg.colorScheme=='dark';document.documentElement.dataset.theme=tg.colorScheme;tg.setHeaderColor(dk?'#0f0b16':'#f5f3fa');tg.setBackgroundColor(dk?'#0f0b16':'#f5f3fa')}catch(e){}}
function hap(){try{tg.HapticFeedback.impactOccurred('light')}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function svg(s,w){return '<svg width="'+w+'" height="'+w+'" viewBox="0 0 20 20" fill="currentColor">'+s+'</svg>'}
var IC2=svg('<rect x="2" y="2" width="7" height="7" rx="2"/><rect x="11" y="2" width="7" height="7" rx="2"/><rect x="2" y="11" width="7" height="7" rx="2"/><rect x="11" y="11" width="7" height="7" rx="2"/>',18);
var IC3=(function(){var s='';[1,7.5,14].forEach(function(y){[1,7.5,14].forEach(function(x){s+='<rect x="'+x+'" y="'+y+'" width="5" height="5" rx="1.5"/>'})});return svg(s,18)})();
var ICL=svg('<rect x="2" y="3" width="4" height="4" rx="1.2"/><rect x="8" y="4" width="10" height="2" rx="1"/><rect x="2" y="8" width="4" height="4" rx="1.2"/><rect x="8" y="9" width="10" height="2" rx="1"/><rect x="2" y="13" width="4" height="4" rx="1.2"/><rect x="8" y="14" width="10" height="2" rx="1"/>',18);
var ICT=svg('<rect x="2" y="4" width="16" height="2" rx="1"/><rect x="2" y="9" width="16" height="2" rx="1"/><rect x="2" y="14" width="16" height="2" rx="1"/>',18);
var ICF=svg('<path d="M2 4h16l-6 7v5l-4-2v-3z"/>',16),STAR=svg('<path d="M10 1.8l2.4 5 5.4.7-4 3.7 1 5.4L10 14l-4.8 2.6 1-5.4-4-3.7 5.4-.7z"/>',16);
function eye(n){return '<svg class="ey" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'+n}
function dot(w){return w?'💜':'❤️'}
function nm(s){return String(s||'').toLowerCase().replace(/ё/g,'е')}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function bg(s){s=String(s||'');var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;
 return 'radial-gradient(circle at 25% 15%,hsl('+h+' 85% 68%),transparent 60%),linear-gradient(160deg,hsl('+(h+25)+' 70% 52%),hsl('+(h+75)+' 62% 26%))'}
function ts(d){if(!d)return 0;var p=String(d).split('.');return p.length==3?new Date(p[2],p[1]-1,p[0]).getTime():new Date(p[0],0,1).getTime()}
function today(){var d=new Date();return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()}
function toast(t,ms){var e=$('toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},ms||3000)}
function store(){try{localStorage.setItem('sm',JSON.stringify(D))}catch(e){}}
function api(b){b.initData=tg.initData;return fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).catch(function(){throw new Error('net')}).then(function(r){return r.json().catch(function(){throw new Error('bad_response')})}).then(function(j){if(!j.ok)throw new Error(j.error);return j})}
function fail(e){var m=ERR[e.message]||('Ошибка: '+e.message);if(D.length)toast(m);else $('list').innerHTML='<div class="empty">'+m+'</div>'}
function load(){return api({action:'list'}).then(function(j){if((j.ver||0)<4)toast(ERR.old,9000);D=j.items;S.me=S.add=j.me.who;store();refresh()}).catch(fail)}
function byId(id){return D.filter(function(x){return x.id==id})[0]}
function resetFlt(){S.fmt='Все';S.fav=S.unw=S.top=S.multi=false;S.by=null;S.genres=[];S.sort='def'}
function ok(x){var q=nm(S.q.trim());
 return (S.tab=='all'||x.st==S.tab)&&(S.fmt=='Все'||x.f==S.fmt)&&(!q||nm(x.ru).indexOf(q)>=0||nm(x.en).indexOf(q)>=0)&&(!S.fav||x.fav)&&(!S.unw||(!x.n&&x.st!='done'))&&(S.by===null||x.by===S.by)&&S.genres.every(function(g){return nm(x.g).indexOf(g)>=0})&&(!S.top||x.r>=8)&&(!S.multi||x.n>1)}
function nflt(){return (S.by!==null)+(S.genres.length>0)+S.top+S.multi+S.unw+(S.sort!='def')}
function chip(k,v,l,on){return '<button class="cp'+(on?' on':'')+'" data-k="'+k+'"'+(v===undefined?'':' data-v="'+esc(v)+'"')+'>'+l+'</button>'}
function pz(x){return '<div class="pz'+(x.by===null?'':' w'+x.by)+'" style="background:'+bg(x.en||x.ru)+'"><span>'+(EM[x.f]||'🎬')+'</span>'+(x.poster?'<img src="'+esc(x.poster)+'" loading="lazy" decoding="async" alt="" onerror="this.remove()">':'')}
function meta(x){return esc([x.y,String(x.f).toLowerCase()].filter(Boolean).join(', ')+(x.st=='done'&&x.d?', '+x.d:''))}
function render(){
 $('tabs').innerHTML=TABS.map(function(t){var n=t[0]=='all'?D.length:D.filter(function(x){return x.st==t[0]}).length;return '<button data-t="'+t[0]+'" class="'+(S.tab==t[0]?'on':'')+'">'+t[1]+'<small>'+n+'</small></button>'}).join('');
 var n=nflt();
 $('chips').innerHTML='<button class="cp ic'+(S.fav?' on':'')+'" data-k="fav" aria-label="Избранное">'+STAR+'</button>'+FM.map(function(f){return chip('fmt',f[0],f[1],S.fmt==f[0])}).join('')+'<button class="cp ic'+(n?' on':'')+'" data-a2="flt" aria-label="Фильтры">'+ICF+(n?'<b class="nb">'+n+'</b>':'')+'</button>';
 $('views').innerHTML=[['2',IC2,'Плитки в 2 столбца'],['3',IC3,'Плитки в 3 столбца'],['l',ICL,'Список с постерами'],['t',ICT,'Список без постеров']].map(function(v){return '<button data-view="'+v[0]+'" class="'+(S.v==v[0]?'on':'')+'" aria-label="'+v[2]+'">'+v[1]+'</button>'}).join('');
 var L=D.filter(ok),s=S.sort;
 if(s=='az')L.sort(function(a,b){return a.ru.localeCompare(b.ru,'ru')});
 else if(s=='year')L.sort(function(a,b){return (+b.y||0)-(+a.y||0)});
 else if(s=='rating')L.sort(function(a,b){return b.r-a.r});
 else if(s=='date')L.sort(function(a,b){return ts(b.d)-ts(a.d)});
 else L.sort(function(a,b){return (b.ad||0)-(a.ad||0)||(b.ro||0)-(a.ro||0)});
 var li=S.v!='2'&&S.v!='3',w=$('list');w.className='grid '+(li?'gl':'g'+S.v);
 if(!L.length){w.innerHTML='<div class="empty">'+(D.length?'Ничего не нашлось.<br>Нажмите «+», чтобы добавить, или поменяйте фильтры.':'Загружаю список…')+'</div>';return}
 w.innerHTML=L.map(function(x){
  var prg=x.ser&&x.st!='done'?'Серия '+esc(x.ser):'';
  if(S.v=='t')return '<button class="tile cr'+(x.by===null?'':' w'+x.by)+'" data-id="'+esc(x.id)+'"><div class="in"><div class="tt">'+esc(x.ru)+'</div><div class="mt">'+esc(x.en)+(x.en?', ':'')+meta(x)+'</div></div><div class="rg">'+(x.st=='now'?'<span>▶</span>':x.st=='drop'?'<span>⏹</span>':'')+(prg?'<span>'+prg+'</span>':'')+(x.n>0?'<span class="tag">'+eye(x.n)+'</span>':'')+(x.fav?'<span>⭐</span>':'')+'</div></button>';
  if(li)return '<button class="tile row" data-id="'+esc(x.id)+'">'+pz(x)+'</div><div class="in"><div class="tt">'+esc(x.ru)+(x.fav?' ⭐':'')+'</div><div class="mt">'+esc(x.en)+'</div><div class="mt">'+meta(x)+'</div><div class="tags">'+(x.st=='now'?'<span class="tag p">▶ Смотрим</span>':x.st=='drop'?'<span class="tag">⏹ Заброшено</span>':'')+(x.n>0?'<span class="tag">'+eye(x.n)+'</span>':'')+(prg?'<span class="tag">'+prg+'</span>':'')+'</div></div></button>';
  return '<button class="tile" data-id="'+esc(x.id)+'">'+pz(x)+(x.st=='now'?'<div class="bdg nw">▶</div>':x.st=='drop'?'<div class="bdg nw dp">⏹</div>':'')+(x.n>0?'<div class="bdg cnt">'+eye(x.n)+'</div>':'')+(prg?'<div class="bdg prg">'+prg+'</div>':'')+(x.fav?'<div class="bdg fv">⭐</div>':'')+'</div><div class="tt">'+esc(x.ru)+'</div><div class="mt">'+meta(x)+'</div></button>'}).join('');
}
function refresh(){if(SHEET)dirty=true;else render()}
function openSheet(h,k){SHEET=k;$('sh').innerHTML='<div class="grip"></div>'+h;$('bk').className='bk on';$('sh').className='sh on'}
function closeSheet(){SHEET='';$('bk').className='bk';$('sh').className='sh';if(dirty){dirty=false;render()}}
function isOn(k,v){return k=='by'?S.by===+v:k=='genre'?S.genres.indexOf(v)>=0:k=='sort'?S.sort==v:k=='fmt'?S.fmt==v:!!S[k]}
function syncChips(){[].forEach.call(document.querySelectorAll('#sh .cp[data-k]'),function(b){b.classList.toggle('on',isOn(b.dataset.k,b.dataset.v))})}
function filterSheet(){
 var G={};D.forEach(function(x){String(x.g).split(/,\s*/).forEach(function(g){g=g.trim().toLowerCase();if(g)G[g]=1})});
 var SO=[['def','Последние добавленные'],['date','Дата просмотра'],['az','А—Я'],['year','Новые по году'],['rating','Рейтинг']];
 openSheet('<h2>Фильтры</h2><div class="sub lb">Кто предложил</div><div class="fl">'+chip('by',0,dot(0),S.by===0)+chip('by',1,dot(1),S.by===1)+'</div>'+
  '<div class="sub lb">Жанр</div><div class="fl">'+Object.keys(G).sort().map(function(g){return chip('genre',g,esc(cap(g)),S.genres.indexOf(g)>=0)}).join('')+'</div>'+
  '<div class="sub lb">Ещё</div><div class="fl">'+chip('unw',undefined,'Ещё не смотрели',S.unw)+chip('top',undefined,'Рейтинг 8+',S.top)+chip('multi',undefined,'Смотрели не раз',S.multi)+'</div>'+
  '<div class="sub lb">Сортировка</div><div class="fl">'+SO.map(function(s){return chip('sort',s[0],s[1],S.sort==s[0])}).join('')+'</div>'+
  '<div class="acts"><button class="btn" data-a2="reset">Сбросить</button><button class="btn main" data-a2="close">Показать</button></div>','flt');
}
function detail(id){
 var x=byId(id);if(!x)return;cur=id;
 var ab=function(a,v,ic,c,on){return '<button class="ab'+(on?' on':'')+'" data-a="'+a+'"'+(v===undefined?'':' data-v="'+v+'"')+'><span>'+ic+'</span>'+c+'</button>'};
 var rt=x.f=='Сериал'?(x.seasons?x.seasons+' сез.':''):(x.runtime?x.runtime+' мин':'');
 var sr=x.f=='Сериал'?'<div class="st"><b>Серия '+(esc(x.ser)||'—')+'</b><em>сезон</em><button data-a="s-">−</button><button data-a="s+">+</button><em>серия</em><button data-a="e-">−</button><button data-a="e+">+</button><button data-a="ser" data-v="" aria-label="Сбросить серию">✕</button></div>':'';
 openSheet('<div class="hd">'+pz(x)+'</div><div><h2>'+esc(x.ru)+'</h2><div class="sub">'+esc(x.en)+'</div><div class="sub">'+meta(x)+'</div>'+(x.r?'<span class="rt">★ '+x.r+'</span>':'')+'</div></div>'+(x.o?'<p>'+esc(x.o)+'</p>':'')+
 '<div class="kv">'+(x.g?'<span>Жанр</span><span>'+esc(cap(x.g))+'</span>':'')+(x.country?'<span>Страна</span><span>'+esc(x.country)+'</span>':'')+(rt?'<span>Длительность</span><span>'+rt+'</span>':'')+'</div>'+
 '<div class="sub lb">Статус</div><div class="ga c4">'+ab('status','want','📋','В списке',x.st=='want')+ab('status','now','▶️','Смотрим',x.st=='now')+ab('status','drop','⏹️','Заброшено',x.st=='drop')+ab('status','done','✅','Просмотрено',x.st=='done')+'</div>'+
 '<div class="ga c2" style="margin-top:10px">'+ab('fav',undefined,'⭐','Избранное',x.fav)+'<label class="ab"><span>📅</span>'+(x.d?esc(x.d):'Дата просмотра')+'<input type="date" id="dt"></label></div>'+
 '<div class="st"><b>Просмотров</b><button data-a="n-">−</button><span class="n">'+eye(x.n||0)+'</span><button data-a="n+">+</button></div>'+sr+
 '<div class="st"><b>Предложил(а)</b><button class="w0'+(x.by===0?' on':'')+'" data-a="who" data-v="0" aria-label="Красный">'+dot(0)+'</button><button class="w1'+(x.by===1?' on':'')+'" data-a="who" data-v="1" aria-label="Фиолетовый">'+dot(1)+'</button></div>','detail');
}
// Мгновенно применяем действие на экране, ответ таблицы сверяем потом
function apply(x,a,v){
 var td=today();
 if(a=='status'){
  if(v=='now')x.st='now';
  else if(v=='drop')x.st='drop';
  else if(v=='want'){x.n=0;x.d='';x.st='want'}
  else if(v=='done'){if(!(x.st=='drop'&&x.n>0)&&x.st!='done'){x.n=(x.n||0)+1;x.d=td}x.st='done'}
 }
 else if(a=='n+'){x.n=(x.n||0)+1;x.d=td;if(x.st=='want')x.st='done'}
 else if(a=='n-'){x.n=Math.max(0,(x.n||0)-1);if(!x.n){x.d='';if(x.st=='done')x.st='want'}}
 else if(a=='fav')x.fav=!x.fav;
 else if(a=='ser')x.ser=v;
 else if(a=='who')x.by=+v;
 else if(a=='date'){var p=String(v).split('-');x.d=p[2]+'.'+p[1]+'.'+p[0];x.n=Math.max(1,x.n||0);if(x.st=='want')x.st='done'}
}
function send(id,a,v){
 pend[id]=(pend[id]||0)+1;
 api({action:'set',id:id,op:a,value:v}).then(function(j){pend[id]--;if(pend[id])return;
  var i=D.findIndex(function(x){return x.id==id});if(i<0)return;
  if(j.item&&JSON.stringify(D[i])==JSON.stringify(j.item))return;
  if(j.item)D[i]=j.item;else D.splice(i,1);store();
  if(SHEET=='detail'&&cur==id){if(j.item)detail(id);else closeSheet()}refresh()
 }).catch(function(e){pend[id]--;fail(e);if(!pend[id])load()});
}
function act(a,v){
 var x=byId(cur);if(!x)return;
 if((a=='status'&&v==x.st)||(a=='n-'&&!x.n))return;
 var go=function(){hap();apply(x,a,v);detail(x.id);refresh();send(x.id,a,v)};
 if(a=='status'&&v=='want'&&x.n>0&&tg&&tg.showConfirm)tg.showConfirm('Вернуть в список? Просмотры и дата будут сброшены.',function(y){if(y)go()});
 else go();
}
function ser(a){
 var x=byId(cur),m=(x.ser||'1,00').split(','),s=+m[0],e=+m[1];
 if(a=='s+'){s++;e=1}if(a=='s-'&&s>1){s--;e=1}if(a=='e+')e++;if(a=='e-'&&e>1)e--;
 x.ser=s+','+('0'+e).slice(-2);detail(x.id);refresh();hap();
 var id=x.id,v=x.ser;clearTimeout(ser.t);ser.t=setTimeout(function(){send(id,'ser',v)},700);
}
function hitsHtml(R){return R.length?R.map(function(c){return '<button class="hit" data-key="'+esc(c.key)+'" data-dup="'+(c.dup?1:0)+'"><div class="mini" style="background:'+bg(c.ru)+'">'+(EM[c.f]||'🎬')+(c.poster?'<img src="'+esc(c.poster)+'" alt="" onerror="this.remove()">':'')+'</div><div><b>'+esc(c.ru)+'</b><span class="sub">'+esc([c.y,String(c.f).toLowerCase()].filter(Boolean).join(', '))+'</span>'+(c.dup?'<div class="dup">Уже в таблице</div>':'')+'</div></button>'}).join(''):'<div class="empty">Не нашли. Попробуйте добавить год: «Название (2014)».</div>'}
function addSheet(){
 S.add=S.me;
 openSheet('<h2>Добавить</h2><div class="sub" style="margin:0 0 8px">Кто предложил</div><div class="fl" style="margin-bottom:12px">'+chip('add',0,dot(0),S.add==0)+chip('add',1,dot(1),S.add==1)+'</div><input class="q" id="aq" placeholder="Название на русском или английском"><div id="hits"><div class="empty">Начните вводить название.<br>Остальное подтянется само.</div></div>','add');
 $('aq').focus();
 $('aq').oninput=function(){
  clearTimeout(addSheet.t);var v=this.value.trim();
  if(v.length<2){$('hits').innerHTML='';return}
  $('hits').innerHTML='<div class="empty">Ищу…</div>';
  addSheet.t=setTimeout(function(){api({action:'search',q:v}).then(function(j){if($('aq')&&$('aq').value.trim()==v)$('hits').innerHTML=hitsHtml(j.results)}).catch(function(e){$('hits').innerHTML='<div class="empty">'+(ERR[e.message]||'Ошибка: '+e.message)+'</div>'})},500)};
}
function addItem(key){
 toast('Добавляю…');
 api({action:'add',key:key,who:S.add}).then(function(j){var it=j.item;if(!it)return;
  var i=D.findIndex(function(x){return x.id==it.id});if(i<0)D.push(it);else D[i]=it;store();
  closeSheet();S.tab='all';resetFlt();S.q='';$('q').value='';render();toast(j.dup?'Это уже было в таблице':'Добавили «'+it.ru+'»')}).catch(fail);
}
document.addEventListener('click',function(e){
 var t=e.target.closest('button,#bk');if(!t)return;var d=t.dataset;
 if(t.id=='bk')closeSheet();
 else if(t.id=='ref'){toast('Обновляю…');load()}
 else if(d.t){S.tab=d.t;resetFlt();render()}
 else if(d.view){S.v=d.view;try{localStorage.setItem('smv',d.view)}catch(e){}render()}
 else if(d.k){
  if(d.k=='add'){S.add=+d.v;[].forEach.call(t.parentNode.children,function(b){b.classList.toggle('on',b===t)});return}
  if(d.k=='genre'){var gi=S.genres.indexOf(d.v);if(gi<0)S.genres.push(d.v);else S.genres.splice(gi,1)}
  else if(d.v===undefined)S[d.k]=!S[d.k];
  else if(d.k=='fmt'||d.k=='sort')S[d.k]=d.v;
  else S[d.k]=String(S[d.k])===d.v?null:(d.k=='by'?+d.v:d.v);
  render();if(SHEET=='flt')syncChips()}
 else if(d.a2=='flt')filterSheet();
 else if(d.a2=='reset'){resetFlt();render();filterSheet()}
 else if(d.a2=='close')closeSheet();
 else if(d.id&&t.classList.contains('tile'))detail(d.id);
 else if(d.a){if(/^[se][+-]$/.test(d.a))ser(d.a);else act(d.a,d.v)}
 else if(t.id=='add')addSheet();
 else if(d.key){if(d.dup=='1'){closeSheet();detail(d.key)}else addItem(d.key)}
});
document.addEventListener('change',function(e){if(e.target.id=='dt'&&e.target.value)act('date',e.target.value)});
$('q').oninput=function(){S.q=this.value;render()};
try{D=JSON.parse(localStorage.getItem('sm')||'[]')}catch(e){D=[]}
try{S.v=localStorage.getItem('smv')||S.v}catch(e){}
render();
if(!tg||!tg.initData){$('list').innerHTML='<div class="empty">Откройте приложение через бота в Telegram.</div>'}
else load();
</script>
</body>
</html>
