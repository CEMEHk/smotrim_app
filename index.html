function view(x,td){if(!x.hist.length&&x.n&&x.d)x.hist=[x.d];x.hist.push(td);x.n=(x.n||0)+1;x.d=td}
// Мгновенно применяем действие на экране, ответ таблицы сверяем потом
function apply(x,a,v){
 var td=today();x.hist=x.hist||[];
 if(a=='status'){
  if(v=='now')x.st='now';
  else if(v=='drop')x.st='drop';
  else if(v=='want'){x.n=0;x.d='';x.hist=[];x.st='want'}
  else if(v=='done'){if(!(x.st=='drop'&&x.n>0)&&x.st!='done')view(x,td);x.st='done'}
 }
 else if(a=='n+'){view(x,td);if(x.st=='want')x.st='done'}
 else if(a=='n-'){if((x.n||0)<=1){x.n=0;x.d='';x.hist=[];if(x.st=='done')x.st='want'}else{x.n--;if(x.hist.length){x.hist.pop();if(x.hist.length)x.d=x.hist[x.hist.length-1]}}}
 else if(a=='fav')x.fav=!x.fav;
 else if(a=='ser')x.ser=v;
 else if(a=='who')x.by=+v;
 else if(a=='rate'){var r=v===''?null:+v;if(S.me==0)x.rm=r;else x.rf=r}
 else if(a=='date'){var p=String(v).split('-'),dm=p[2]+'.'+p[1]+'.'+p[0];x.d=dm;if(x.hist.length)x.hist[x.hist.length-1]=dm;else x.hist=[dm];x.n=Math.max(1,x.n||0);if(x.st=='want')x.st='done'}
}
function send(id,a,v){
 pend[id]=(pend[id]||0)+1;
 api({action:'set',id:id,op:a,value:v}).then(function(j){pend[id]--;if(pend[id])return;
  var i=D.findIndex(function(x){return x.id==id});if(i<0)return;
  if(j.item&&JSON.stringify(D[i])==JSON.stringify(j.item))return;
  if(j.item)D[i]=j.item;else D.splice(i,1);store();
  if(SHEET=='detail'&&cur==id){if(j.item)detail(id);else closeSheet()}refresh()
 }).catch(function(e){pend[id]--;fail(e);if(!pend[id])load()});
}
function act(a,v){
 var x=byId(cur);if(!x)return;
 if(a=='delete'){hap();D.splice(D.indexOf(x),1);store();closeSheet();render();toast(tx('del_done'));send(x.id,'delete');return}
 if((a=='status'&&v==x.st)||(a=='n-'&&!x.n))return;
 var go=function(){hap();apply(x,a,v);detail(x.id);refresh();send(x.id,a,v)};
 if(a=='status'&&v=='want'&&x.n>0&&tg&&tg.showConfirm)tg.showConfirm(tx('confirm_reset'),function(y){if(y)go()});
 else go();
}
function ser(a){

 x.ser=s+','+('0'+e).slice(-2);detail(x.id);refresh();hap();
 var id=x.id,v=x.ser;clearTimeout(ser.t);ser.t=setTimeout(function(){send(id,'ser',v)},700);

 else if(d.id&&t.classList.contains('tile'))detail(d.id);

// ПК: листание зажатой ПРАВОЙ кнопкой мыши с инерцией. Левая работает как обычно, текст копируется.
(function(){var sc=null,y0=0,t0=0,mv=false,vel=0,ly=0,lt=0,raf=0,EX='input,textarea,select,p,.sub,.kv>span,h2,.hs,label';
 function stop(){cancelAnimationFrame(raf)}
 function coast(el){var f=function(){if(Math.abs(vel)<.03)return;el.scrollTop+=vel*16;vel*=.94;raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}
 document.addEventListener('mousedown',function(e){stop();mv=false;sc=null;
  if(e.button!==2||e.target.closest(EX))return;
  var s=e.target.closest('.sh');if(!s&&SHEET)return;
  sc=s||document.scrollingElement;y0=ly=e.clientY;t0=sc.scrollTop;lt=performance.now();vel=0});
 document.addEventListener('mousemove',function(e){if(!sc)return;var dy=e.clientY-y0;if(!mv&&Math.abs(dy)>4)mv=true;if(!mv)return;
  var n=performance.now(),dt=n-lt;if(dt>0){vel=.7*vel+.3*((ly-e.clientY)/dt);ly=e.clientY;lt=n}
  sc.scrollTop=t0-dy;e.preventDefault()});
 document.addEventListener('mouseup',function(){if(sc&&mv&&performance.now()-lt<90)coast(sc);sc=null});
 document.addEventListener('wheel',stop,{passive:true});
 document.addEventListener('contextmenu',function(e){if(!e.target.closest(EX))e.preventDefault()})})();
